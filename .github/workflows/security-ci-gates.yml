# M4-05 / M4-06: AC-security-redact-01 + AC-security-uri-01 prod security gates.
name: Security CI gates

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: security-ci-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-security-gates:
    name: JS fixture CI gate contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11'
          cache: npm
      - run: npm ci
      - run: npm test -- --testPathPattern='securityCiGate'

  android-security-gates:
    name: Android security CI gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11'
          cache: npm
      - run: npm ci
      - name: Run native security CI gate tests
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.dupbuster.scanengine.fixtures.SecurityCiGateTest' \
            --tests 'com.dupbuster.scanengine.fixtures.SecurityUriCiGateTest' \
            --tests 'com.dupbuster.scanengine.security.RedactionFilterTest' \
            --tests 'com.dupbuster.scanengine.security.SafUriRulesTest'
